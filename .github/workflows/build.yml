# 每次推送 / PR：跑单元测试，打 Windows 安装包（在 Actions 页面的 Artifacts 里下载）。
# 推一个 v 开头的标签（比如 git tag v0.1.0 && git push origin v0.1.0）：另外建一个 GitHub Release，挂上安装包。
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 单元测试
        run: cargo test -p joyime-pinyin -p joyime-english -p joyime-core

      - name: 安装 Tauri CLI
        working-directory: app
        run: npm ci

      # beforeBuildCommand 会先编译 64 位和 32 位的输入法 DLL
      - name: 打安装包
        working-directory: app
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: JoyIME-windows-setup
          path: target/release/bundle/nsis/*.exe

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/nsis/*.exe
          generate_release_notes: true
